services:
  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: discovery-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=discovery-service
      - OTEL_METRICS_EXPORTER=none
      - OTEL_TRACES_EXPORTER=otlp
    ports:
      - "8761:8761"
    networks:
      - default
      - observability
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'   # Limite l'usage CPU à 50% d'un CPU
          memory: 512M  # Limite l'usage mémoire à 512MB
        reservations:
          cpus: '0.25'  # Réserve au moins 25% d'un CPU
          memory: 256M  # Réserve au moins 256MB de mémoire
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_APPLICATION_NAME=gateway-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:${DISCOVERY_PORT}/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      # - SPRING_DATASOURCE_URL=jdbc:postgresql://db:${DB_GATEWAY_PORT}/${DB_GATEWAY_NAME}
      # - SPRING_DATASOURCE_USERNAME=${DB_USER}
      # - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      # - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_DATA_REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - PROMETHEUS_PORT=8080
      - LOKI_URL=${LOKI_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=gateway-service
      - OTEL_METRICS_EXPORTER=none
      - OTEL_TRACES_EXPORTER=otlp
    ports:
      - "${GATEWAY_PORT}:8888"
    networks:
      - default
      - observability
    depends_on:
      discovery-service:
        condition: service_started
      redis-gateway:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'   # Limite l'usage CPU à 50% d'un CPU
          memory: 512M  # Limite l'usage mémoire à 512MB
        reservations:
          cpus: '0.25'  # Réserve au moins 25% d'un CPU
          memory: 256M  # Réserve au moins 256MB de mémoire

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:${DISCOVERY_PORT}/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_AUTH_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - PROMETHEUS_PORT=9090
      - LOKI_URL=${LOKI_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_METRICS_EXPORTER=none
      - OTEL_TRACES_EXPORTER=otlp
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - RABBIT_EXCHANGE_NAME=${RABBIT_EXCHANGE_NAME}
      - RABBIT_ROUTING_KEY=${RABBIT_ROUTING_KEY}
      - RABBIT_QUEUE_NAME=${RABBIT_QUEUE_NAME}
    ports:
      - "${AUTH_SERVICE_PORT}:4000"
    networks:
      - default
      - observability
    depends_on:
      discovery-service:
        condition: service_started
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'   # Limite l'usage CPU à 50% d'un CPU
          memory: 512M  # Limite l'usage mémoire à 512MB
        reservations:
          cpus: '0.25'  # Réserve au moins 25% d'un CPU
          memory: 256M  # Réserve au moins 256MB de mémoire
  db:
    image: postgres:18-alpine
    container_name: sims_auth_service_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_AUTH_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_AUTH_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  subscription-service:
    build:
      context: ./subscription-service
      dockerfile: Dockerfile
    container_name: subscription-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-subscription:5432/${DB_SUB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_SUB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_SUB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PROMETHEUS_PORT=9090
      - LOKI_URL=${LOKI_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=subscription-service
      - OTEL_METRICS_EXPORTER=none
      - OTEL_TRACES_EXPORTER=otlp
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL}
    ports:
      - "${SUB_SERVICE_PORT}:4001"
    networks:
      - default
      - observability
    depends_on:
      - discovery-service
      - db-subscription
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'   # Limite l'usage CPU à 50% d'un CPU
          memory: 512M  # Limite l'usage mémoire à 512MB
        reservations:
          cpus: '0.25'  # Réserve au moins 25% d'un CPU
          memory: 256M  # Réserve au moins 256MB de mémoire
  db-subscription:
    image: postgres:18-alpine
    container_name: sims_subscription_service_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_SUB_NAME}
      POSTGRES_USER: ${DB_SUB_USER}
      POSTGRES_PASSWORD: ${DB_SUB_PASSWORD}
    ports:
      - "${DB_SUB_PORT}:5432"
    volumes:
      - db_sub_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_auth
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-postgres}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      - db
      - db-subscription
  redis-gateway:
    image: redis:7.4-alpine
    container_name: gateway_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
      - observability
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    environment:
      - REDIS_HOST=redis-gateway
      - REDIS_PORT=6379
    volumes:
      - redis_insight_data:/db
    depends_on:
      - redis-gateway
    networks:
      - default
  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    container_name: email-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - PROMETHEUS_PORT=9090
      - LOKI_URL=${LOKI_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=email-service
      - OTEL_METRICS_EXPORTER=none
      - OTEL_TRACES_EXPORTER=otlp
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - RABBIT_EXCHANGE_NAME=${RABBIT_EXCHANGE_NAME}
      - RABBIT_ROUTING_KEY=${RABBIT_ROUTING_KEY}
      - RABBIT_QUEUE_NAME=${RABBIT_QUEUE_NAME}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
    ports:
      - "${EMAIL_SERVICE_PORT}:4004"
    networks:
      - default
      - observability
    depends_on:
      discovery-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'   # Limite l'usage CPU à 50% d'un CPU
          memory: 512M  # Limite l'usage mémoire à 512MB
        reservations:
          cpus: '0.25'  # Réserve au moins 25% d'un CPU
          memory: 256M  # Réserve au moins 256MB de mémoire
  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
    
volumes:
  db_data:
  db_sub_data:
  pgadmin_data:
  redis_data:
  redis_insight_data:

networks:
  observability:
    external: true