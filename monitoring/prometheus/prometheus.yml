global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: "dev"

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # - job_name: 'microservices'
  #   file_sd_configs:
  #     - files:
  #       - '/etc/prometheus/file_sd_configs/app_ms_simswap.yml'

  - job_name: 'gateway_service'
    metrics_path: 'actuator/prometheus'
    static_configs:
      - targets: ['gateway-service:8888']
      - labels:
          application: 'Gateway Service Application'

  - job_name: 'auth_service'
    metrics_path: 'actuator/prometheus'
    static_configs:
      - targets: ['auth-service:4000']
      - labels:
          application: 'Authentication Service Application'

#   - job_name: "fake_service"
