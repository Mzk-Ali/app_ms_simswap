# ===============================
# Application
# ===============================
spring.application.name=email-service
server.port=4004
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# Discovery
# ===============================
spring.cloud.config.enabled=false
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

# ===============================
# Management / Actuator
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show.details=always

# Metrics Prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# ===============================
# Tracing / Correlation
# ===============================
# Probabilite d'echantillonnage des traces (1.0 = toutes les requetes) : Passer a� 0.1 en prod
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.log-correlation.enabled=true
management.tracing.baggage.enabled=true

management.otlp.tracing.endpoint=http://tempo:4318/v1/traces

# Pattern pour afficher traceId/spanId dans les logs
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# ===============================
# OpenTelemetry Exporter (OTLP)
# ===============================
otel.traces.exporter=otlp
otel.instrumentation.logback-mdc.enabled= true
otel.exporter.otlp.endpoint=http://tempo:4318
otel.resource.attributes=service.name=${spring.application.name}

# ===============================
# Mailing
# ===============================
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

application.mail.sent.from=${MAIL_FROM}

# ===============================
# RabbitMq
# ===============================
rabbitmq.exchange.email.name=${RABBIT_EXCHANGE_NAME}
rabbitmq.binding.email.name=${RABBIT_ROUTING_KEY}
rabbitmq.queue.email.name=${RABBIT_QUEUE_NAME}

spring.rabbitmq.listener.simple.default-requeue-rejected=false
