<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe modifié - Simswap</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f4; padding: 20px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px;">
                    <tr>
                        <td style="padding: 40px;">
                            <h2>Votre mot de passe a été modifié</h2>
                            <p style="color: #666;">Votre mot de passe a été modifié avec succès le <strong th:text="${changeDate}"></strong>.</p>
                            <p style="color: #999; font-size: 14px;">
                                Si vous n'êtes pas à l'origine de ce changement, contactez-nous immédiatement.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
