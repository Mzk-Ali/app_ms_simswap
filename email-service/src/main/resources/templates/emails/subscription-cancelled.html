<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Abonnement Annulé - Simswap</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f4; padding: 20px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px;">
                    <tr>
                        <td style="padding: 40px; text-align: center;">
                            <h1 style="color: #333;">Abonnement Annulé</h1>
                            <p style="color: #666;">Votre abonnement <strong th:text="${planName}"></strong> a été annulé.</p>
                            <p style="color: #666;">Vous conservez l'accès jusqu'au <strong th:text="${endDate}"></strong>.</p>
                            <table width="100%" cellpadding="0" cellspacing="0" style="margin: 30px 0;">
                                <tr>
                                    <td align="center">
                                        <a th:href="${subscribeUrl}" 
                                           style="display: inline-block; padding: 14px 40px; background-color: #6366f1; color: #ffffff; text-decoration: none; border-radius: 6px;">
                                            Réactiver mon abonnement
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
